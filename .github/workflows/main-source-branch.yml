name: Main source branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review

jobs:
  main-source-branch:
    name: main-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as source branch
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ] || [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Pull requests targeting main must come from the dev branch in this repository."
            exit 1
          fi
